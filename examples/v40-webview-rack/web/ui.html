<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'" />
  <title>WEBVIEW RACK</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:  #0a0a0a;
      --fg:  #ddd;
      --dim: #888;
      --acc: #ff6600;
      --bord:#333;
    }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px;
      padding: 10px;
      display: flex; flex-direction: column; gap: 8px;
    }
    h1 {
      margin: 0 0 4px; font-size: 10px; letter-spacing: 2px;
      color: var(--dim); font-weight: normal;
    }
    .module {
      border: 1px solid var(--bord); padding: 8px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .row {
      display: flex; align-items: center; gap: 10px;
    }
    .row label { color: var(--dim); width: 48px; }
    .row input[type="range"] { flex: 1; accent-color: var(--acc); }
    .row .val { color: var(--acc); width: 52px; text-align: right; }
    .jack-row { display: flex; gap: 6px; }
    .jack-btn {
      background: transparent; color: var(--fg);
      border: 1px solid var(--bord); padding: 2px 8px;
      cursor: pointer; font: inherit; letter-spacing: 0.5px;
    }
    .jack-btn.on { background: var(--acc); color: var(--bg); border-color: var(--acc); }
    .help { color: var(--dim); font-size: 10px; line-height: 1.4; }
  </style>
</head>
<body>
  <h1>LFO RACK · WEBVIEW PORTS DEMO</h1>

  <div id="rack"></div>

  <p class="help">
    Each LFO has an OUT jack already exposed; toggle RATE IN to accept
    rate modulation from another source. Drag cables from the plugin
    window's edge jacks to any other plugin parameter.
  </p>

<script>
(function () {
  "use strict";

  // Port structure is driven by whatever the host announces in
  // `subPortsAvailable` — we don't hardcode ids here. This way the iframe
  // stays a pure renderer of the manifest.
  const modulesByIndex = new Map();
  const visible = new Set();

  function post(msg) { window.parent.postMessage(msg, "*"); }

  // When the user toggles a jack we post the full visible set — this is
  // a declarative replace, not a diff.
  function sendVisible() {
    post({
      type: "subPortsUpdate",
      visible: [...visible].map(id => ({ id })),
    });
  }

  function rebuildRack() {
    const rack = document.getElementById("rack");
    rack.textContent = "";
    const sorted = [...modulesByIndex.keys()].sort();
    for (const idx of sorted) {
      const mod = modulesByIndex.get(idx);
      const wrap = document.createElement("div");
      wrap.className = "module";

      const headRow = document.createElement("div");
      headRow.className = "row";
      const nameLabel = document.createElement("label");
      nameLabel.textContent = "LFO" + idx;
      const rateIn = document.createElement("input");
      rateIn.type = "range";
      rateIn.min = "0.1"; rateIn.max = "20"; rateIn.step = "0.1";
      rateIn.value = String(mod.rateValue);
      const rateVal = document.createElement("span");
      rateVal.className = "val";
      rateVal.textContent = Number(rateIn.value).toFixed(1) + "Hz";
      rateIn.addEventListener("input", () => {
        const v = Number(rateIn.value);
        mod.rateValue = v;
        rateVal.textContent = v.toFixed(1) + "Hz";
        post({ type: "paramWrite", key: mod.rateKey, value: v });
      });
      headRow.appendChild(nameLabel);
      headRow.appendChild(rateIn);
      headRow.appendChild(rateVal);

      const jackRow = document.createElement("div");
      jackRow.className = "jack-row";
      if (mod.outId) jackRow.appendChild(jackButton("CV OUT", mod.outId));
      if (mod.inId)  jackRow.appendChild(jackButton("RATE IN", mod.inId));

      wrap.appendChild(headRow);
      wrap.appendChild(jackRow);
      rack.appendChild(wrap);
    }
  }

  function jackButton(label, portId) {
    const btn = document.createElement("button");
    btn.className = "jack-btn" + (visible.has(portId) ? " on" : "");
    btn.textContent = label;
    btn.addEventListener("click", () => {
      if (visible.has(portId)) visible.delete(portId);
      else                      visible.add(portId);
      btn.classList.toggle("on", visible.has(portId));
      sendVisible();
    });
    return btn;
  }

  // Parse a port id like "lfo2.out" / "lfo2.rate" — strip the "lfo" prefix
  // to get the module number and the field to shove it into.
  function placePort(p) {
    const m = /^lfo(\d+)\.(out|rate)$/.exec(p.id);
    if (!m) return;
    const idx = parseInt(m[1], 10);
    const field = m[2];
    let mod = modulesByIndex.get(idx);
    if (!mod) {
      mod = { rateKey: "rate" + idx, rateValue: 1, outId: null, inId: null };
      modulesByIndex.set(idx, mod);
    }
    if (field === "out") mod.outId = p.id;
    else                 mod.inId  = p.id;
    if (p.defaultVisible) visible.add(p.id);
  }

  window.addEventListener("message", (e) => {
    const msg = e.data;
    if (!msg || typeof msg !== "object") return;
    switch (msg.type) {
      case "param":
        // Keep local rate sliders in sync with host-side changes (MIDI
        // Learn, tracker FX automation, another control writing the
        // same param).
        for (const mod of modulesByIndex.values()) {
          if (msg.key === mod.rateKey) mod.rateValue = msg.value;
        }
        rebuildRack();
        break;
      case "subPortsAvailable":
        modulesByIndex.clear();
        visible.clear();
        for (const p of (msg.ports || [])) placePort(p);
        rebuildRack();
        break;
      case "__nt_error":
        console.warn("[webview-rack]", msg.where, msg.message);
        break;
    }
  });

  post({ type: "__nt_ready" });
})();
</script>
</body>
</html>
